# Foundation-model encoder branch configuration.
# Paths may be absolute or relative to this YAML file.

dataset:
  id: NormanWeissman2019
  perturbed_group: single

  # Group-level folder containing S0-S5 variant directories.
  pseudo_root: /path/to/pseudo_pairing/NormanWeissman2019/single

  # Required only by the UMAP and downstream MLP stages.
  control_h5ad: /path/to/processed/NormanWeissman2019_control_processed.h5ad
  perturbed_h5ad: /path/to/processed/NormanWeissman2019_single_processed.h5ad
  pairing_manifest: /path/to/pseudo_pairing/NormanWeissman2019/pseudo_pairing_repetition_manifest.csv
  evaluation_root: /path/to/evaluation/NormanWeissman2019_pseudo_pairing_evaluation
  perturbation_key: perturbation_key

  # Empty means discover all pseudo-control variants.
  variants:
    - S0_naive_mean_control_reference
    - S1_random_single_control/seed_000
    - S2_random_average_controls/k_100/seed_000
    - S3_SEACell_metacell_average/nmc_200/k_05/seed_000
    - S4_SEACell_balanced_random_sample/nmc_200/seed_000
    - S5_SEACell_OT_sampled_average/nmc_200/topk_05/seed_000

# Local checkouts of the corresponding upstream repositories.
repositories:
  geneformer: /path/to/repos/Geneformer
  scgpt: /path/to/repos/scGPT
  sccello: /path/to/repos/scCello
  scimilarity: /path/to/repos/scimilarity

checkpoints:
  # Geneformer checkpoint folder loadable by transformers.from_pretrained().
  geneformer_model: /path/to/models/geneformer/gf-6L-30M-i2048
  # Optional; defaults to <repositories.geneformer>/geneformer/token_dictionary.pkl.
  geneformer_token_dictionary: null

  # Folder containing args.json and best_model.pt.
  scgpt_model_dir: /path/to/models/scgpt/scgpt_full_human
  # Optional; defaults to <repositories.scgpt>/scgpt/tokenizer/default_gene_vocab.json.
  scgpt_vocab_file: null

  # Optional local token dictionary; defaults to the path inside the scCello checkout.
  sccello_token_dictionary: null
  # Hugging Face model identifier or local checkpoint directory.
  sccello_checkpoint: katarinayuan/scCello-zeroshot

  # Extracted SCimilarity pretrained-model directory.
  scimilarity_model: /path/to/models/scimilarity/model_v1.1

# A separate environment per encoder is recommended because upstream dependencies
# can conflict. Values may be an executable name or an absolute python path.
environments:
  python:
    default: python
    geneformer: /path/to/envs/geneformer/bin/python
    scgpt: /path/to/envs/scgpt/bin/python
    sccello: /path/to/envs/sccello/bin/python
    scimilarity: /path/to/envs/scimilarity/bin/python
    scvi: /path/to/envs/scvi/bin/python
    umap: /path/to/envs/scvi/bin/python
    mlp: /path/to/envs/evaluation/bin/python

# Null entries use the original folder layout under dataset.pseudo_root. Keeping
# that layout lets the downstream MLP resolver find embeddings automatically.
outputs:
  geneformer: null
  scgpt: null
  sccello: null
  scimilarity: null
  scvi: null
  hvg: null
  umap: /path/to/evaluation/embedding_umaps

# Stages selected when launcher.py is run without --model.
enabled:
  geneformer: true
  scgpt: true
  sccello: true
  scimilarity: true
  scvi: true       # Runs both HVG-PCA and scVI unless changed below.
  umap: false
  mlp: false

settings:
  continue_on_error: true

  geneformer:
    batch_size: 64
    chunk_cells: 10000
    subset_n_cells: null
    write_h5ad: true
    overwrite: false

  scgpt:
    batch_size: 64
    num_workers: 0
    write_h5ad: true
    overwrite: false

  sccello:
    batch_size: 64
    chunk_cells: 4096
    subset_n_cells: null
    max_variants: null
    write_h5ad: false
    overwrite: false

  scimilarity:
    use_gpu: true
    chunk_cells: 4096
    subset_n_cells: null
    counts_source: X
    write_h5ad: false
    overwrite: false

  scvi:
    run_hvg_pca: true
    run_scvi: true
    use_gpu: true
    batch_size: 256
    counts_layer: null
    write_h5ad: true
    overwrite: false

  umap:
    models: [geneformer, hvg_pca, scvi, scimilarity, scgpt, sccello]
    leiden_key: null
    subsample_n_cells: 50000
    overwrite: false

mlp_evaluation:
  models_to_run: [mlp_expr, geneformer, hvg, scvi, sccello, scimilarity, scgpt]
  forward_target_space: expression
  inverse_input_space: expression
  mlp_tasks: [forward, inverse_strategy_delta, inverse_common_delta]
  device: auto

  max_eval_genes: 3000
  min_cells_per_perturbation: 20
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  split_seed: 42
  model_seed: 42

  batch_size: 256
  num_workers: 0
  forward_epochs: 30
  inverse_epochs: 30
  early_stop_patience: 3
  learning_rate: 0.001
  weight_decay: 0.00001
  hidden_dim: 1024
  latent_dim: 512
  pert_emb_dim: 256
  dropout: 0.15
  max_grad_norm: 5.0

  inverse_topk_accuracy_list: [3, 5, 10]
  topk_effect_genes: [20, 50, 100]
  skip_existing_forward: true
  skip_existing_inverse: true
  save_inverse_predictions: true
  return_inverse_probabilities: false
  save_mlp_checkpoints: false
  save_runtime_cache: false
  strict_selected_variants: true
  continue_on_error: true
