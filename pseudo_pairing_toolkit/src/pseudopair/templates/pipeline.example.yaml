project:
  dataset_id: Replogle_K562_essential
  workdir: ./work

acquisition:
  enabled: false
  overwrite: false
  files:
    - url: "https://zenodo.org/records/7041849/files/ReplogleWeissman2022_K562_essential.h5ad?download=1"
      output: ./data/raw/Replogle_K562_essential.h5ad
      # sha256: optional_checksum

preprocessing:
  enabled: true
  input_h5ad: ./data/raw/Replogle_K562_essential.h5ad
  output_dir: ./work/processed/Replogle_K562_essential
  annotation:
    nperts_key: nperts
    perturbation_source_key: gene
    standardized_perturbation_key: perturbation_key
    condition_key: condition
    multiplicity_key: perturbation_multiplicity
    analysis_group_key: analysis_group
    control_perturbation_label: control
  store_counts: true
  counts_layer: counts
  normalize_total: true
  target_sum: 10000
  log1p: true
  compute_global_embedding: true
  recompute_group_embedding: true
  n_top_genes: 3000
  hvg_flavor: seurat_v3
  n_pcs: 50
  n_neighbors: 30
  neighbors: true
  leiden: true
  umap: true
  min_cells_per_group: 500
  groups: [control, single]

pairing:
  enabled: true
  output_root: ./work/pairing
  control_group: control
  perturbed_groups: [single]
  strategies_to_run:
    - S0_naive_mean_control_reference
    - S1_random_single_control
    - S2_random_average_controls
    - S3_SEACell_metacell_average
    - S4_SEACell_balanced_random_sample
    - S5_SEACell_OT_sampled_average
  expr_layer: X
  embedding_key: X_pca
  perturbation_key: perturbation_key
  require_all_genes: false
  random_seeds: [0, 1, 2, 3, 4]
  max_pairs_per_perturbation: null
  pair_selection_seed: 42
  batch_size: 4096
  matrix_batch_size: 4096
  sampling_replace: true
  store_sampled_control_positions: true
  overwrite_existing_outputs: false
  s2_n_control_cells_to_average_values: [100]
  seacell_settings:
    - setting_id: nmc_50
      n_metacells: 50
      n_waypoint_eigs: 10
      seacells_n_iter: 100
      seacell_seed: 42
    - setting_id: nmc_100
      n_metacells: 100
      n_waypoint_eigs: 10
      seacells_n_iter: 100
      seacell_seed: 42
    - setting_id: nmc_200
      n_metacells: 200
      n_waypoint_eigs: 10
      seacells_n_iter: 100
      seacell_seed: 42
    - setting_id: nmc_350
      n_metacells: 350
      n_waypoint_eigs: 10
      seacells_n_iter: 100
      seacell_seed: 42
    - setting_id: nmc_500
      n_metacells: 500
      n_waypoint_eigs: 10
      seacells_n_iter: 100
      seacell_seed: 42
  overwrite_memberships: false
  use_gpu_seacells: false
  s3_n_metacells_to_average_values: [3, 5, 10]
  sample_metacells_with_replacement: true
  s5_top_k_values: [1, 3, 5]
  sample_cells_per_metacell: 10
  ot_reg: 0.05
  ot_max_iter: 2000
  ot_tol: 1.0e-7
  cost_metric: sqeuclidean
  control_mass: size
  overwrite_assignments: false
  overwrite_sampled_outputs: false

evaluation:
  enabled: true
  eval_root: ./work/evaluation/Replogle_K562_essential_pseudo_pairing_evaluation
  perturbed_groups_to_evaluate: [single]
  perturbation_key: perturbation_key
  strategies_to_evaluate: null
  evaluation_tasks: [control_manifold, perturbation_effect, mlp]
  max_eval_genes: 3000
  max_runs_to_evaluate: null
  check_shared_genes_across_all_runs: true
  seed: 42
  n_pcs: 50
  n_control_sample_for_pca: 10000
  n_control_sample_for_overlap: 10000
  n_pseudo_sample_for_overlap: 10000
  n_mmd_sample: 3000
  source_mixing_k: 30
  min_cells_per_perturbation: 20
  top_de_k_list: [20, 50, 100]
  mlp_tasks: [forward, inverse_strategy_delta, inverse_common_delta]
  device: auto
  split_seed: 42
  model_seed: 42
  train_frac: 0.70
  val_frac: 0.15
  batch_size: 256
  num_workers: 0
  forward_epochs: 30
  inverse_epochs: 30
  early_stop_patience: 3
  learning_rate: 0.001
  weight_decay: 0.00001
  hidden_dim: 1024
  latent_dim: 512
  pert_emb_dim: 256
  dropout: 0.15
  inverse_topk_accuracy_list: [3, 5, 10]
  topk_effect_genes: [20, 50, 100]
  skip_existing_forward: true
  skip_existing_inverse: true
  save_inverse_predictions: true

analysis:
  enabled: true
  run_aggregation: true
  run_final_comparison: false
  perturbed_groups: [single]
  tasks: [control_manifold, perturbation_effect, mlp_forward, mlp_inverse]
  allow_missing_tasks: false
  allow_task_failures: false
  strict_metrics: true
  plot_s0_reference: true
  plot_s1_reference: true
  plot_naive_inverse_reference: true
  # After stage 1, edit selected_variants_TEMPLATE_EDIT_ME.csv, then set:
  # run_aggregation: false
  # run_final_comparison: true
  # selection_path: ./work/evaluation/.../single/result_analysis/selected_variants_TEMPLATE_EDIT_ME.csv
